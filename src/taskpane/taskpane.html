<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xlsNoob</title>
    <style><%= htmlWebpackPlugin.options.themeCss %></style>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: var(--space-md);
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
      }
      h1 { margin: 0; font-size: 1rem; font-weight: 600; }
      p { margin: 0; }
      button { cursor: pointer; font: inherit; }
      button:disabled { cursor: default; opacity: 0.42; }
      button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .surface { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); }
      .btn {
        min-height: 30px;
        padding: 5px 10px;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        font-weight: 500;
      }
      .btn:hover { background: var(--surface-hover); }
      .btn:active { background: var(--surface-active); }
      .btn-sm { min-height: 28px; padding: 4px 8px; font-size: 0.75rem; }
      .btn-primary { color: var(--text-on-accent); background: var(--accent); border-color: var(--accent); }
      .btn-primary:hover { background: var(--accent-hover); }
      .btn-ghost { background: transparent; border-color: transparent; }
      .btn-danger { color: var(--danger); background: var(--danger-soft); border-color: transparent; }
      .btn-link { min-height: auto; padding: 2px; background: transparent; border-color: transparent; }
      .btn-danger-text { color: var(--danger); }
      .control {
        width: 100%;
        min-width: 0;
        box-sizing: border-box;
        min-height: 32px;
        padding: 6px 8px;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        font: inherit;
      }
      .control:hover { border-color: var(--text-subtle); }
      .control-compact { min-height: 30px; font-size: 0.8rem; }
      .taskpane-header {
        display: grid;
        gap: var(--space-sm);
        margin-bottom: var(--space-md);
      }
      .taskpane-header p {
        color: var(--text-muted);
        font-size: 0.78rem;
        line-height: 1.4;
      }
      .favorites-toolbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: var(--space-sm);
        margin-bottom: var(--space-sm);
      }
      #favoritesCount {
        display: inline-block;
        margin-left: 4px;
        color: var(--text-subtle);
        font-weight: 700;
      }
      #addCurrentFavorite,
      #addFavoriteGroup,
      #themeToggle {
        min-width: 28px;
        width: 28px;
        height: 28px;
        padding: 0;
        color: var(--text-muted);
        text-align: center;
      }
      #addCurrentFavorite.is-favorited { color: var(--warning); }
      #favoriteSearch { min-width: 0; }
      .favorite-group {
        display: grid;
        gap: 0;
        margin-bottom: 6px;
      }
      .favorite-group-header-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 28px;
        align-items: center;
        gap: 2px;
      }
      .favorite-group-header {
        display: flex;
        align-items: center;
        gap: 5px;
        width: 100%;
        padding: 3px 6px;
        background: transparent;
        border: 0;
        border-radius: var(--radius-sm);
        font-size: 0.78rem;
        font-weight: 600;
        text-align: left;
        color: var(--accent) !important;
      }
      .favorite-group-header:hover { background: var(--surface-hover); }
      .favorite-group-chevron { font-size: 0.8rem; }
      .favorite-group-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .favorite-group-count { color: var(--accent) !important; opacity: 0.75; }
      .favorite-group-items { display: grid; gap: 0; }
      .favorite-card {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 30px;
        align-items: center;
        min-height: 42px;
        padding-left: 6px;
        background: transparent;
        border-top: 1px solid var(--border);
        transition: background 120ms ease;
      }
      .favorite-card:hover { background: var(--surface-hover); }
      .favorite-main {
        display: flex;
        align-items: center;
        width: 100%;
        min-width: 0;
        min-height: 42px;
        padding: 3px 0;
        color: var(--text);
        background: transparent;
        border: none;
        text-align: left;
      }
      .favorite-main-content { display: grid; align-items: center; width: 100%; min-width: 0; gap: 1px; }
      .favorite-title-row { display: flex; align-items: center; min-width: 0; }
      .favorite-main strong {
        display: block;
        min-width: 0;
        overflow: hidden;
        color: var(--text);
        font-size: 0.8rem;
        line-height: 1.3;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .favorite-note {
        display: inline-flex;
        align-items: center;
        max-width: 100%;
        padding: 1px 4px;
        overflow: hidden;
        color: var(--accent-text);
        background: var(--accent-soft);
        border-radius: var(--radius-sm);
        font-size: 0.58rem;
        font-weight: 500;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .favorite-location {
        max-width: 100%;
        color: var(--text-muted);
        font-size: 0.62rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .action-menu { position: relative; margin-right: 0; }
      .action-menu summary { list-style: none; }
      .action-menu summary::-webkit-details-marker { display: none; }
      .icon-action {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        box-sizing: border-box;
        color: var(--text-muted);
        background: transparent;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: 1rem;
        line-height: 1;
      }
      .icon-action:hover, .action-menu[open] .icon-action { color: var(--text); background: var(--surface-active); border-color: var(--border); }
      .action-menu-items {
        position: absolute;
        top: calc(100% + var(--space-xs));
        right: 0;
        z-index: 5;
        display: grid;
        width: min(190px, calc(100vw - 40px));
        padding: var(--space-xs);
        background: var(--surface);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-menu);
      }
      .action-menu-item {
        min-height: 30px;
        padding: 5px var(--space-sm);
        color: var(--text);
        background: transparent;
        border: 0;
        border-radius: var(--radius-sm);
        text-align: left;
        font-size: 0.75rem;
      }
      .action-menu-item:hover { background: var(--surface-hover); }
      .action-menu-item:last-child { color: var(--danger); }
      .favorite-edit { display: grid; grid-column: 1 / -1; gap: var(--space-sm); padding: var(--space-md); }
      .favorite-edit h3 { margin: 0 0 2px; font-size: 0.88rem; }
      .favorite-field { display: grid; gap: 3px; color: var(--text-muted); font-size: 0.72rem; font-weight: 600; }
      .favorite-field input { color: var(--text); font-size: 0.82rem; font-weight: 400; }
      .favorite-form-location {
        padding: 3px 0;
        overflow: hidden;
        color: var(--text-muted);
        font-size: 0.75rem;
        font-weight: 400;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .favorite-form-actions, .favorite-remove-area {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: var(--space-sm);
      }
      .favorite-remove-area {
        min-height: 28px;
        padding-top: 4px;
        border-top: 1px solid var(--border);
        color: var(--text-muted);
        font-size: 0.72rem;
      }
      #emptyFavorites { color: var(--text-muted); font-size: 0.82rem; }
      #status:empty { display: none; }
      #status { margin-top: var(--space-lg); font-size: 0.8rem; color: var(--text-muted); }
      #status.status-toast {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 10;
        max-width: calc(100% - 24px);
        box-sizing: border-box;
        margin: 0;
        padding: 7px 10px;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 3px solid var(--success);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-menu);
      }
      .favorite-dialog-backdrop {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: rgba(18, 18, 18, 0.28);
        padding: 16px;
      }
      .favorite-dialog {
        width: min(320px, 100%);
        display: grid;
        gap: 12px;
        padding: 16px;
        background: var(--surface);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-menu);
      }
      .favorite-dialog h3 { margin: 0; font-size: 0.9rem; }
      .favorite-dialog p { margin: 0; color: var(--text-muted); font-size: 0.78rem; line-height: 1.5; }
      .favorite-dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
    </style>
  </head>
  <body>
    <header class="taskpane-header">
      <h1>Favorites <span id="favoritesCount">0</span></h1>
      <p>Save Excel workbooks from SharePoint or OneDrive, organize them into groups, and reopen them quickly in Excel for Mac.</p>
    </header>
    <section class="section" aria-label="Favorites">
      <div class="favorites-toolbar">
        <input id="favoriteSearch" class="control control-compact" type="search" placeholder="Search favorites" aria-label="Search favorites" />
        <div style="display:flex; gap:4px; align-items:center;">
          <button id="addCurrentFavorite" class="btn btn-ghost btn-sm" type="button" aria-label="Add current workbook to favorites">☆</button>
          <button id="addFavoriteGroup" class="btn btn-ghost btn-sm" type="button" aria-label="Create new group">＋</button>
          <button id="themeToggle" class="btn btn-ghost btn-sm" type="button" aria-label="Use dark theme" title="Toggle light and dark theme">◐</button>
        </div>
      </div>
      <div id="favoritesList"></div>
      <p id="emptyFavorites">No favorites yet.</p>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </body>
</html>
